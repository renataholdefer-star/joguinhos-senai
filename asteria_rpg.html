<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#100d29"><title>ASTERIA — Fragmentos do Vazio</title>
<style>
:root{--bg:#090c1b;--panel:rgba(10,14,35,.9);--line:#7185d8;--cyan:#64f0ff;--pink:#ff70d5;--gold:#ffd878;--white:#f2f4ff}
*{box-sizing:border-box}html,body{margin:0;height:100%;background:var(--bg);color:var(--white);font-family:Inter,system-ui,Segoe UI,Arial,sans-serif}body{overflow:hidden}button{font:inherit;color:inherit;cursor:pointer;touch-action:manipulation}button:focus-visible{outline:2px solid var(--gold);outline-offset:3px}
#game{height:100dvh;min-height:500px;position:relative;overflow:hidden;background:#11102e;isolation:isolate}
.sky{position:absolute;inset:0 0 100px;background:radial-gradient(ellipse at 66% 35%,#ff6dcf 0,#653c9c 18%,transparent 43%),linear-gradient(160deg,#060d25 5%,#171044 45%,#332065 68%,#0a2c4b 100%);overflow:hidden}
.stars{position:absolute;inset:0;background-image:radial-gradient(#fff 1px,transparent 1.5px),radial-gradient(#91eaff 1px,transparent 1.5px);background-size:61px 61px,103px 103px;background-position:0 0,32px 19px;opacity:.55}
.moon{position:absolute;right:28%;top:7%;width:clamp(65px,9vw,125px);aspect-ratio:1;border-radius:50%;background:#f6dfff;box-shadow:0 0 50px #fa87ff;opacity:.85}
.floating{position:absolute;background:linear-gradient(135deg,#314b7b,#15234e 60%,#0a1733);clip-path:polygon(0 0,100% 0,84% 68%,62% 74%,50% 100%,34% 76%,13% 70%);filter:drop-shadow(0 15px 9px #0008)}
.island1{width:36%;height:36%;right:19%;top:21%;clip-path:polygon(0 30%,20% 14%,65% 0,100% 22%,85% 65%,60% 70%,50% 100%,35% 73%,10% 66%);background:linear-gradient(140deg,#54619d,#202d63 55%,#0e2242)}
.island2{width:42%;height:31%;left:-7%;bottom:11%;background:linear-gradient(140deg,#3b4e70,#18294d 60%,#0a1b37)}
.island3{width:35%;height:28%;right:-9%;bottom:8%;background:linear-gradient(140deg,#3a4c7b,#17264d 65%,#07182e)}
.waterfall{position:absolute;right:32%;top:47%;height:53%;width:7px;background:linear-gradient(#63efff,#9af8ff55,transparent);box-shadow:0 0 13px #55eaff;opacity:.8}
.waterfall.two{right:22%;top:65%;height:35%;width:4px}
.castle{position:absolute;right:28%;top:14%;width:clamp(105px,18vw,220px);height:clamp(100px,21vh,205px);filter:drop-shadow(0 0 12px #ff58d4)}
.castle .base{position:absolute;bottom:0;left:15%;width:70%;height:52%;background:linear-gradient(90deg,#354775,#a8a7d8,#353a70);clip-path:polygon(10% 0,90% 0,100% 100%,0 100%)}
.tower{position:absolute;bottom:28%;width:23%;height:62%;background:linear-gradient(90deg,#344574,#a4a8d7,#303d6b)}
.tower:before{content:"";position:absolute;top:-30%;left:-8%;width:116%;height:32%;background:#ff75da;clip-path:polygon(50% 0,100% 100%,0 100%)}
.tower.a{left:12%}.tower.b{right:12%;height:78%}.tower.c{left:39%;height:100%;width:24%;bottom:34%}
.window{position:absolute;bottom:12%;left:45%;width:10%;height:20%;background:#74f5ff;box-shadow:0 0 12px #74f5ff}
.ground{position:absolute;left:-8%;bottom:7%;width:61%;height:39%;background:linear-gradient(140deg,#4c7d73,#1a4d57 58%,#122c49);clip-path:polygon(0 33%,19% 7%,48% 0,74% 18%,100% 52%,85% 100%,0 100%)}
.grass{position:absolute;left:0;bottom:10%;width:55%;height:22%;background:repeating-linear-gradient(120deg,transparent 0 15px,#57b8a444 16px 18px,transparent 19px 28px);clip-path:polygon(0 0,100% 20%,100% 100%,0 100%)}
.path{position:absolute;left:31%;bottom:7%;width:33%;height:25%;background:linear-gradient(100deg,#9d7b9a,#d3a9bd,#7d7bb2);clip-path:polygon(36% 0,58% 0,73% 35%,100% 100%,0 100%,29% 35%);opacity:.92}
.bridge{position:absolute;right:15%;bottom:18%;width:24%;height:22px;background:repeating-linear-gradient(90deg,#a77d9a 0 18px,#644d7f 19px 22px);border:3px solid #30294f;transform:rotate(-8deg);box-shadow:0 8px 0 #121a39}
.portal{position:absolute;right:23%;bottom:21%;width:clamp(42px,7vw,78px);height:clamp(62px,11vh,105px);border:7px solid #5adfff;border-radius:50% 50% 10% 10%;background:radial-gradient(ellipse,#f3b6ff,#4d4cff 45%,#142c74 70%);box-shadow:0 0 22px #46eaff,inset 0 0 18px #ff80ff;animation:pulse 2.5s infinite}
.camp{position:absolute;left:14%;bottom:24%;font-size:clamp(45px,7vw,80px);filter:drop-shadow(0 0 12px #ff9b46)}
.companion{position:absolute;left:34%;bottom:14%;font-size:clamp(23px,4vw,40px);filter:drop-shadow(0 3px 2px #000)}
.hero{position:absolute;left:41%;bottom:13%;width:42px;height:82px;z-index:6;transition:left .12s linear,bottom .12s linear;filter:drop-shadow(0 4px 4px #000)}
.hero .cloak{position:absolute;left:4px;top:29px;width:36px;height:43px;background:linear-gradient(90deg,#19244b,#cf315e);clip-path:polygon(12% 0,88% 0,100% 91%,50% 100%,0 88%)}
.hero .face{position:absolute;z-index:2;left:11px;top:4px;width:24px;height:27px;border-radius:45%;background:#e8b391;border:3px solid #29263e}
.hero .hair{position:absolute;z-index:3;left:7px;top:0;width:31px;height:15px;background:#181626;border-radius:70% 55% 22% 20%}
.hero .torso{position:absolute;z-index:2;left:9px;top:30px;width:28px;height:28px;background:#303e69;border:2px solid #121b36;border-radius:6px}
.hero .leg{position:absolute;top:56px;width:12px;height:23px;background:#28263e;border:2px solid #121426}.hero .leg.l{left:9px}.hero .leg.r{left:25px}
.hero .blade{position:absolute;right:-4px;top:35px;width:4px;height:43px;background:#d9faff;box-shadow:0 0 7px #8af8ff;transform:rotate(-32deg)}
.hud{position:absolute;z-index:10;background:var(--panel);border:1px solid #8095d777;box-shadow:0 8px 30px #0005;backdrop-filter:blur(10px);border-radius:14px}
.stats{top:12px;left:12px;width:min(320px,calc(100% - 24px));padding:10px;display:flex;gap:10px;align-items:center}
.portrait{width:53px;height:53px;border-radius:50%;display:grid;place-items:center;font-size:30px;background:linear-gradient(140deg,#5e5aa7,#161e43);border:2px solid #9cf6ff;flex-shrink:0}
.statsmain{flex:1}.statstop{display:flex;justify-content:space-between;font-weight:800;margin-bottom:5px}.bar{height:10px;border-radius:9px;background:#1a2245;overflow:hidden;margin:4px 0;position:relative}.bar span{display:block;height:100%;transition:width .2s}.hp span{background:linear-gradient(90deg,#ff315e,#ff85a4)}.mp span{background:linear-gradient(90deg,#268cff,#5df0ff)}.xp span{background:linear-gradient(90deg,#a85cff,#ff77de)}.bar label{position:absolute;inset:0;text-align:center;font-size:9px;line-height:10px;font-weight:800;text-shadow:0 1px 2px #000}
.minimap{position:absolute;right:16px;top:12px;width:clamp(95px,14vw,155px);aspect-ratio:1;border-radius:50%;border:3px solid #718acb;background:radial-gradient(ellipse at 45% 38%,#456f79 0 12%,#193b52 13% 30%,#24345b 31% 49%,#0c1735 50%);box-shadow:0 0 0 5px #080e26bb;display:grid;place-items:center;font-size:26px}.minimap:before{content:"✦";color:var(--cyan);text-shadow:0 0 12px var(--cyan)}.minimap:after{content:"N";position:absolute;top:5px;font-size:10px}.clock{position:absolute;right:16px;top:calc(clamp(95px,14vw,155px) + 25px);font-size:11px;color:#c6d7ff}
.quest{right:16px;top:clamp(175px,25vh,245px);width:min(290px,calc(100% - 32px));padding:12px}.quest h3{margin:0 0 7px;font-size:14px;color:var(--gold)}.quest p{margin:0 0 8px;font-size:12px;line-height:1.4}.quest .progress{font-size:11px;color:#bceaff}.quest button{border:1px solid #6f83c8;background:#1c2750;border-radius:8px;padding:6px 9px;font-size:11px;margin-top:8px}
.side-menu{position:absolute;z-index:11;left:0;top:26%;display:grid;gap:4px;padding:6px;background:#090e26ce;border:1px solid #7287d455;border-left:0;border-radius:0 13px 13px 0}.side-menu button{width:58px;padding:8px 3px;border:0;border-radius:8px;background:transparent;font-size:10px;display:grid;justify-items:center;gap:4px}.side-menu button span{font-size:21px}.side-menu button.active{background:#38417a;color:var(--cyan)}
.joystick{position:absolute;z-index:12;left:18px;bottom:120px;width:116px;height:116px;border-radius:50%;border:1px solid #c0d8ff77;background:#080f2dbb;display:grid;place-items:center;touch-action:none}.stick{width:47px;height:47px;border-radius:50%;background:#bac8e8aa;border:2px solid #f0f5ff;box-shadow:0 3px 10px #0007}
.actions{position:absolute;z-index:12;right:15px;bottom:120px;display:grid;grid-template-columns:repeat(2,60px);gap:8px;align-items:end}.act{height:60px;width:60px;border-radius:50%;background:#0b1434dd;border:1px solid #b7d7ff99;display:grid;place-content:center;justify-items:center;font-size:24px;box-shadow:0 4px 14px #0005}.act small{font-size:9px}.act.attack{height:75px;width:75px;font-size:30px;border:2px solid #c8faff;background:#162653f5}
.bottom{position:absolute;z-index:13;bottom:0;left:0;right:0;min-height:100px;padding:9px max(10px,env(safe-area-inset-right)) max(9px,env(safe-area-inset-bottom)) max(10px,env(safe-area-inset-left));display:grid;grid-template-columns:minmax(170px,1fr) minmax(250px,1.2fr);gap:10px;background:linear-gradient(0deg,#070b1bf5,#0a1028ed);border-top:1px solid #6c82c755}
.log{max-height:82px;overflow:auto;border:1px solid #6578b966;border-radius:10px;padding:7px 9px;font-size:11px;line-height:1.4;color:#d8e5ff}.log p{margin:2px 0}.log b{color:var(--cyan)}
.hotbar{display:flex;align-items:center;justify-content:center;gap:6px}.slot{width:clamp(38px,5vw,54px);aspect-ratio:1;border:1px solid #7387bc;border-radius:9px;background:linear-gradient(145deg,#19264b,#0c122e);display:grid;place-items:center;position:relative;font-size:23px}.slot small{position:absolute;right:3px;bottom:0;font-size:9px;color:#cbd6ff}.slot:active{transform:scale(.94)}
.toast{display:none;position:absolute;z-index:25;top:50%;left:50%;transform:translate(-50%,-50%);padding:12px 17px;border:1px solid var(--cyan);border-radius:12px;background:#101538f5;box-shadow:0 0 30px #4beaff44;text-align:center;max-width:80%}.toast.show{display:block;animation:appear .2s}
.backdrop{position:absolute;z-index:30;inset:0;background:#050719cc;display:none;place-items:center;padding:15px}.backdrop.open{display:grid}.modal{width:min(440px,100%);max-height:85%;overflow:auto;border:1px solid #8b9cff;border-radius:17px;background:#111833;padding:19px;box-shadow:0 20px 70px #000a}.modal h2{color:var(--gold);margin:0 0 12px}.modal p{line-height:1.5;color:#dbe5ff}.modal button{border:1px solid #7286c9;border-radius:9px;background:#283665;padding:9px 13px}.modal .primary{background:#75416f;border-color:#ff8cdb}
@keyframes pulse{0%,100%{filter:brightness(1);box-shadow:0 0 20px #46eaff}50%{filter:brightness(1.45);box-shadow:0 0 35px #ff71e8}}
@keyframes appear{from{opacity:0;transform:translate(-50%,-46%)}to{opacity:1;transform:translate(-50%,-50%)}}
@media(max-width:700px){.sky{bottom:145px}.stats{top:7px;left:7px;width:220px;padding:7px;gap:7px}.portrait{width:39px;height:39px;font-size:22px}.statstop{font-size:12px;margin-bottom:2px}.bar{height:8px;margin:3px 0}.bar label{line-height:8px;font-size:8px}.minimap{top:8px;right:8px;width:82px;border-width:2px}.clock{top:96px;right:8px;font-size:9px}.quest{top:124px;right:8px;width:175px;padding:8px}.quest h3{font-size:11px}.quest p{font-size:10px;margin-bottom:4px}.quest .progress{font-size:9px}.quest button{font-size:10px;padding:4px 6px}.side-menu{top:34%;padding:4px}.side-menu button{width:45px;padding:5px 1px;font-size:9px}.side-menu button span{font-size:18px}.camp{left:9%;bottom:23%}.hero{transform:scale(.85);transform-origin:bottom center}.joystick{width:94px;height:94px;left:10px;bottom:157px}.stick{width:40px;height:40px}.actions{right:9px;bottom:157px;grid-template-columns:repeat(2,49px);gap:5px}.act{width:49px;height:49px;font-size:20px}.act.attack{width:63px;height:63px;font-size:26px}.bottom{min-height:145px;grid-template-columns:1fr;gap:5px;padding:6px 7px max(6px,env(safe-area-inset-bottom))}.log{max-height:40px;font-size:9px;padding:4px 7px}.hotbar{gap:5px}.slot{width:37px;font-size:19px}.ground{bottom:10%;width:72%;height:35%}.path{left:30%;width:44%;bottom:10%}.portal{right:17%;bottom:22%}.bridge{right:9%;width:29%;bottom:18%}}
@media(max-height:600px) and (min-width:701px){.sky{bottom:80px}.bottom{min-height:80px;padding:5px}.log{max-height:68px}.joystick,.actions{bottom:93px}.quest{top:150px}}
</style></head>
<body>
<div id="game">
 <main class="sky" id="sky"><div class="stars"></div><div class="moon"></div><div class="floating island1"></div><div class="floating island2"></div><div class="floating island3"></div><div class="castle"><div class="base"></div><div class="tower a"></div><div class="tower b"></div><div class="tower c"></div><div class="window"></div></div><div class="waterfall"></div><div class="waterfall two"></div><div class="ground"></div><div class="grass"></div><div class="path"></div><div class="bridge"></div><div class="portal" id="portal"></div><div class="camp">⛺🔥</div><div class="companion">🐺</div>
  <div class="hero" id="hero"><div class="cloak"></div><div class="face"></div><div class="hair"></div><div class="torso"></div><div class="leg l"></div><div class="leg r"></div><div class="blade"></div></div>
 </main>
 <section class="hud stats"><div class="portrait">🧑🏻‍🚀</div><div class="statsmain"><div class="statstop"><span>Kael</span><span>NV. <b id="level">1</b></span></div><div class="bar hp"><span id="hpBar" style="width:100%"></span><label id="hpText">100 / 100 PV</label></div><div class="bar mp"><span id="mpBar" style="width:100%"></span><label id="mpText">50 / 50 PM</label></div><div class="bar xp"><span id="xpBar" style="width:0%"></span><label id="xpText">0 / 100 XP</label></div></div></section>
 <div class="minimap" title="Mapa da ilha"></div><div class="clock">☾ 20:45</div>
 <section class="hud quest"><h3>✦ O Despertar dos Fragmentos</h3><p id="questText">Encontre os 3 fragmentos de energia perdidos na ilha.</p><div class="progress" id="questProgress">○ Fragmento da Floresta　0/1<br>○ Fragmento da Montanha　0/1<br>○ Fragmento do Céu　0/1</div><button id="questBtn">Ver diário →</button></section>
 <nav class="side-menu"><button class="active" data-menu="Mapa"><span>🗺️</span>Mapa</button><button data-menu="Missões"><span>📜</span>Missões</button><button data-menu="Personagem"><span>👤</span>Herói</button><button data-menu="Configurações"><span>⚙️</span>Opções</button></nav>
 <div class="joystick" id="joystick" aria-label="Controle de movimento"><div class="stick" id="stick"></div></div>
 <div class="actions"><button class="act" id="potion"><span>🧪</span><small>Poção <b id="pots">3</b></small></button><button class="act" id="skill"><span>✨</span><small>Habilidade</small></button><button class="act" id="run"><span>🏃</span><small>Correr</small></button><button class="act attack" id="attack"><span>⚔️</span><small>Atacar</small></button></div>
 <footer class="bottom"><div class="log" id="log" aria-live="polite"><p><b>[Sistema]</b> Bem-vindo a Asteria, viajante!</p><p><b>[Dica]</b> Explore a ilha, encontre fragmentos e evolua.</p></div><div class="hotbar"><button class="slot" id="slotAttack" title="Ataque">⚔️<small>1</small></button><button class="slot" id="slotRed" title="Poção de vida">🧪<small>2</small></button><button class="slot" id="slotBlue" title="Poção de mana">🔵<small>3</small></button><button class="slot" id="slotSkill" title="Habilidade">💠<small>4</small></button><button class="slot" id="slotCamp" title="Descansar">🔥<small>5</small></button></div></footer>
 <div class="toast" id="toast"></div><div class="backdrop" id="backdrop"><section class="modal"><h2 id="modalTitle">Asteria</h2><div id="modalText"></div><button class="primary" id="close">Continuar</button></section></div>
</div>
<script>
(()=>{'use strict';
const $=id=>document.getElementById(id);
const s={x:41,y:13,hp:100,maxHp:100,mp:50,maxMp:50,xp:0,level:1,pots:3,frags:[false,false,false],kills:0,coins:50,run:false};
let keys={},joyOn=false;
function log(text,tag='Sistema'){const p=document.createElement('p'),b=document.createElement('b');b.textContent='['+tag+'] ';p.append(b,document.createTextNode(text));$('log').append(p);while($('log').children.length>4)$('log').firstChild.remove();$('log').scrollTop=$('log').scrollHeight}
function toast(t){$('toast').textContent=t;$('toast').classList.add('show');setTimeout(()=>$('toast').classList.remove('show'),1700)}
function modal(title,html){$('modalTitle').textContent=title;$('modalText').innerHTML=html;$('backdrop').classList.add('open')}
function close(){ $('backdrop').classList.remove('open') }
$('close').onclick=close;$('backdrop').onclick=e=>{if(e.target===$('backdrop'))close()};
function render(){['hp','mp','xp'].forEach(k=>{let val=k==='hp'?s.hp:k==='mp'?s.mp:s.xp,max=k==='hp'?s.maxHp:k==='mp'?s.maxMp:s.level*100;$(`${k}Bar`).style.width=Math.max(0,val/max*100)+'%';$(`${k}Text`).textContent=k==='hp'?`${s.hp} / ${s.maxHp} PV`:k==='mp'?`${s.mp} / ${s.maxMp} PM`:`${s.xp} / ${max} XP`});$('level').textContent=s.level;$('pots').textContent=s.pots;$('hero').style.left=s.x+'%';$('hero').style.bottom=s.y+'%';$('questProgress').innerHTML=['Floresta','Montanha','Céu'].map((n,i)=>`${s.frags[i]?'✓':'○'} Fragmento da ${n}　${s.frags[i]?1:0}/1`).join('<br>');if(s.frags.every(Boolean))$('questText').textContent='Todos os fragmentos encontrados! O portal está desperto.'}
function xp(n){s.xp+=n;log('Você ganhou '+n+' XP.','Experiência');if(s.xp>=s.level*100){s.xp-=s.level*100;s.level++;s.maxHp+=20;s.maxMp+=10;s.hp=s.maxHp;s.mp=s.maxMp;toast('Nível '+s.level+' alcançado!');log('Você ficou mais forte!','Sistema')}render()}
function move(dx,dy){let speed=s.run?1.4:.72;s.x=Math.max(3,Math.min(94,s.x+dx*speed));s.y=Math.max(3,Math.min(65,s.y+dy*speed));$('hero').style.left=s.x+'%';$('hero').style.bottom=s.y+'%';if(s.x>54&&s.y<29&&!s.frags[1])collect(1);if(s.x>72&&s.y<43&&!s.frags[2])collect(2);if(s.x<25&&s.y>28&&!s.frags[0])collect(0)}
function collect(i){s.frags[i]=true;const names=['Floresta','Montanha','Céu'];s.coins+=20;log('Fragmento da '+names[i]+' encontrado! +20 moedas.','Missão');toast('✦ Fragmento encontrado!');xp(25);render();if(s.frags.every(Boolean)){log('Portal estabilizado! Você completou a missão principal.','Missão');modal('O portal despertou!',`<p>Você reuniu os três fragmentos de Asteria e estabilizou o portal!</p><p>Recompensa: <b>60 moedas</b> e experiência. Continue explorando para fortalecer Kael.</p>`);s.coins+=60}}
function attack(){if(s.mp<5){toast('Mana insuficiente!');return}s.mp-=5;let dmg=10+Math.floor(Math.random()*18)+s.level*2;if(Math.random()<.78){s.kills++;s.coins+=4+Math.floor(Math.random()*8);log(`Você acertou uma criatura sombria causando ${dmg} de dano!`,'Combate');xp(18);toast('Inimigo derrotado! +XP')}else{s.hp=Math.max(1,s.hp-(6+Math.floor(Math.random()*12)));log('A criatura contra-atacou! Você perdeu vida.','Combate');toast('Você recebeu dano!')}render()}
function potion(){if(!s.pots){toast('Sem poções!');return}if(s.hp===s.maxHp&&s.mp===s.maxMp){toast('Seus atributos já estão cheios.');return}s.pots--;s.hp=Math.min(s.maxHp,s.hp+40);s.mp=Math.min(s.maxMp,s.mp+15);render();log('Poção usada: vida e mana recuperadas.','Inventário');toast('Energia restaurada!')}
function skill(){if(s.mp<15){toast('Precisa de 15 PM!');return}s.mp-=15;let n=25+Math.floor(Math.random()*20);s.coins+=5;log(`Explosão astral! Você causou ${n} de dano mágico.`,'Habilidade');xp(12);render();toast('✧ Explosão astral!')}
function journal(){modal('Diário de Asteria',`<p><b>Missão principal: O Despertar dos Fragmentos</b></p><p>Reúna os fragmentos mágicos espalhados pela ilha para despertar o portal.</p><p>${s.frags.filter(Boolean).length}/3 fragmentos encontrados.</p><p>💰 Moedas: ${s.coins}　⚔️ Criaturas vencidas: ${s.kills}</p>`)}
$('attack').onclick=attack;$('slotAttack').onclick=attack;$('potion').onclick=potion;$('slotRed').onclick=potion;$('skill').onclick=skill;$('slotSkill').onclick=skill;$('slotBlue').onclick=()=>{if(s.mp===s.maxMp)toast('Mana já está cheia.');else{s.mp=Math.min(s.maxMp,s.mp+20);render();toast('+20 PM')}};$('slotCamp').onclick=()=>{s.hp=s.maxHp;s.mp=s.maxMp;render();log('Você descansou na fogueira e recuperou tudo.','Sistema');toast('Descanso restaurador!')};$('questBtn').onclick=journal;
function menu(name){if(name==='Missões')journal();else if(name==='Personagem')modal('Kael — personagem',`<p>🗡️ Nível ${s.level} • Aventureiro astral</p><p>❤️ Vida: ${s.hp}/${s.maxHp} PV</p><p>💧 Mana: ${s.mp}/${s.maxMp} PM</p><p>✨ XP: ${s.xp}/${s.level*100}</p><p>💰 Moedas: ${s.coins}</p>`);else if(name==='Configurações')modal('Como jogar',`<p><b>Computador:</b> WASD ou setas para mover, Espaço para atacar, E para coletar fragmentos próximos.</p><p><b>Celular/tablet:</b> use o controle direcional e os botões na tela.</p><p>Encontre fragmentos ao explorar diferentes partes da ilha. Use poções e habilidades durante os combates.</p>`);else toast('Explore a ilha para encontrar fragmentos!')}
document.querySelectorAll('[data-menu]').forEach(b=>b.onclick=()=>{document.querySelectorAll('[data-menu]').forEach(x=>x.classList.remove('active'));b.classList.add('active');menu(b.dataset.menu)});
$('run').onpointerdown=()=>s.run=true;['pointerup','pointerleave','pointercancel'].forEach(ev=>$('run').addEventListener(ev,()=>s.run=false));
window.addEventListener('keydown',e=>{let k=e.key.toLowerCase();if([' ','arrowup','arrowdown','arrowleft','arrowright'].includes(k))e.preventDefault();keys[k]=true;if(k===' ')attack();if(k==='q')potion();if(k==='e')collectNearest()});window.addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);
function collectNearest(){let i=s.x<30?0:s.x>54&&s.y<30?1:2;if(!s.frags[i])collect(i);else toast('Explore outra parte da ilha.')}
function loop(){let dx=0,dy=0;if(keys.a||keys.arrowleft)dx--;if(keys.d||keys.arrowright)dx++;if(keys.w||keys.arrowup)dy++;if(keys.s||keys.arrowdown)dy--;if(dx||dy)move(dx,dy);requestAnimationFrame(loop)}loop();
const joy=$('joystick'),stick=$('stick');function joyMove(e){if(!joyOn)return;let r=joy.getBoundingClientRect(),dx=e.clientX-r.left-r.width/2,dy=e.clientY-r.top-r.height/2,max=r.width*.3,len=Math.hypot(dx,dy)||1;if(len>max){dx=dx/len*max;dy=dy/len*max}stick.style.transform=`translate(${dx}px,${dy}px)`;if(Math.hypot(dx,dy)>9)move(dx/max,-dy/max)}
joy.onpointerdown=e=>{joyOn=true;joy.setPointerCapture(e.pointerId);joyMove(e)};joy.onpointermove=joyMove;function endJoy(){joyOn=false;stick.style.transform='translate(0,0)'}joy.onpointerup=endJoy;joy.onpointercancel=endJoy;
render();
})();
</script></body></html>
